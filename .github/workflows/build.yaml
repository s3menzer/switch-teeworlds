name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # PRIVATE_REPO_TOKEN must be a PAT or GitHub App token that can read the
  # private src/updater submodule. The repository token is sufficient only
  # when all submodules are public.
  CHECKOUT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --replace-all \
            url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C "$GITHUB_WORKSPACE" submodule sync --recursive
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1

      - name: Build Linux in Podman
        shell: bash
        run: ./docker-build-linux.sh

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: teeworlds-linux
          path: |
            build-linux/teeworlds.elf
            build-linux/teeworlds_srv
          if-no-files-found: error

  build-aarch64:
    name: Build Linux AArch64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --replace-all \
            url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C "$GITHUB_WORKSPACE" submodule sync --recursive
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1

      - name: Build Linux AArch64 in Docker
        shell: bash
        run: ./docker-build-aarch64.sh

      - name: Upload Linux AArch64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: teeworlds-linux-aarch64
          path: |
            build-aarch64/teeworlds.elf
            build-aarch64/teeworlds_srv
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --replace-all \
            url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C "$GITHUB_WORKSPACE" submodule sync --recursive
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1

      - name: Build Windows in Podman
        shell: bash
        run: ./docker-build-windows.sh

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: teeworlds-windows
          path: build-windows/*.zip
          if-no-files-found: error

  build-switch:
    name: Build Nintendo Switch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --replace-all \
            url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C "$GITHUB_WORKSPACE" submodule sync --recursive
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1

      - name: Build Switch in Podman
        shell: bash
        run: ./docker-build-switch.sh

      - name: Collect Switch artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p switch-artifacts
          cp build-switch/teeworlds.nro switch-artifacts/
          cp build-switch/game.nro switch-artifacts/
          cp manifests.json switch-artifacts/
          cp settings07.cfg switch-artifacts/

      - name: Upload Switch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teeworlds-switch
          path: switch-artifacts
          if-no-files-found: error
