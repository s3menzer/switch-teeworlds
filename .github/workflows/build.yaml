name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Temporary local-worktree mode for the self-hosted runner. Set to "0" to
  # restore the normal GitHub checkout and submodule initialization.
  USE_LOCAL_WORKTREE: "1"
  # Set PRIVATE_REPO_TOKEN to a PAT or GitHub App token with read access to
  # private repositories used as submodules. Public repositories continue to
  # use the workflow's built-in token.
  CHECKOUT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}

jobs:
  build-cmake:
    runs-on: [self-hosted]
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        include:
        - os: ubuntu-latest
          cmake-args: -G "Unix Makefiles"
          build-args: --parallel
          package-file: teeworlds-*-linux_x86_64.tar.xz
          env:
            CFLAGS: -Wdeclaration-after-statement -Werror
            CXXFLAGS: -Werror
        - os: macOS-latest
          cmake-args: -G "Unix Makefiles"
          build-args: --parallel
          package-file: teeworlds-*-osx.dmg
          env:
            CFLAGS: -Wdeclaration-after-statement -Werror
            CXXFLAGS: -Werror
        - os: windows-latest
          cmake-args: -G "Visual Studio 16 2019" -A x64
          package-file: teeworlds-*-win64.zip
          env:
            CFLAGS: /WX
            CXXFLAGS: /WX
            LDFLAGS: /WX

    steps:
    - name: Checkout repository
      if: ${{ env.USE_LOCAL_WORKTREE != '1' }}
      uses: actions/checkout@v4
      with:
        token: ${{ env.CHECKOUT_TOKEN }}
        persist-credentials: true
    - name: Checkout submodules
      if: ${{ env.USE_LOCAL_WORKTREE != '1' }}
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/*"
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
        auth_header="$(git -C "$GITHUB_WORKSPACE" config --local --get http.https://github.com/.extraheader || true)"
        git -C "$GITHUB_WORKSPACE" submodule sync --recursive
        if [[ -n "$auth_header" ]]; then
          git -C "$GITHUB_WORKSPACE" -c "http.extraheader=$auth_header" \
            -c protocol.version=2 submodule update --init --force --recursive \
            --depth=1
        else
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1
        fi

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install pkg-config cmake libfreetype6-dev libsdl2-dev -y

    - name: Prepare MacOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install pkg-config freetype sdl2

    - name: Build in debug mode
      env: ${{ matrix.env }}
      run: |
        mkdir debug
        cd debug
        ${{ matrix.cmake-path }}cmake --version
        ${{ matrix.cmake-path }}cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Debug -Werror=dev -DDOWNLOAD_GTEST=ON -DDEV=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_DEBUG=. ..
        ${{ matrix.cmake-path }}cmake --build . --config Debug ${{ matrix.build-args }} --target everything
    - name: Test debug
      run: |
        cd debug
        ${{ matrix.cmake-path }}cmake --build . --config Debug ${{ matrix.build-args }} --target run_tests
        ./teeworlds_srv shutdown

    - name: Build in release mode
      env: ${{ matrix.env }}
      run: |
        mkdir release
        cd release
        ${{ matrix.cmake-path }}cmake ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=Release -Werror=dev -DDOWNLOAD_GTEST=ON -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        ${{ matrix.cmake-path }}cmake --build . --config Release ${{ matrix.build-args }} --target everything
    - name: Test release
      run: |
        cd release
        ${{ matrix.cmake-path }}cmake --build . --config Release ${{ matrix.build-args }} --target run_tests
        ./teeworlds_srv shutdown

    - name: Package
      run: |
        cd release
        ${{ matrix.cmake-path }}cmake --build . --config Release ${{ matrix.build-args }} --target package_default
        mkdir artifacts
        mv ${{ matrix.package-file }} artifacts

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: teeworlds-${{ matrix.os }}
        path: release/artifacts

  build-switch:
    name: Build Nintendo Switch
    runs-on: [self-hosted]
    container:
      image: docker.io/devkitpro/devkita64:latest
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      LIBNX: /opt/devkitpro/libnx
      PORTLIBS: /opt/devkitpro/portlibs
      BUILD_DIR: build-switch
      BUILD_TYPE: Release
      AUTO_BUILD_NUMBER: "1"
      INSTALL_SWITCH_HARFBUZZ: "1"
    steps:
    - name: Checkout repository
      if: ${{ env.USE_LOCAL_WORKTREE != '1' }}
      uses: actions/checkout@v4
      with:
        token: ${{ env.CHECKOUT_TOKEN }}
        persist-credentials: true
    - name: Checkout submodules
      if: ${{ env.USE_LOCAL_WORKTREE != '1' }}
      run: |
        set -euo pipefail
        export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/pacman/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/*"
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
        auth_header="$(git -C "$GITHUB_WORKSPACE" config --local --get http.https://github.com/.extraheader || true)"
        git -C "$GITHUB_WORKSPACE" submodule sync --recursive
        if [[ -n "$auth_header" ]]; then
          git -C "$GITHUB_WORKSPACE" -c "http.extraheader=$auth_header" \
            -c protocol.version=2 submodule update --init --force --recursive \
            --depth=1
        else
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1
        fi
    - name: Build Switch NRO
      run: |
        set -euo pipefail
        export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/pacman/bin:$DEVKITPRO/portlibs/switch/bin:$PATH"
        ./build-switch.sh
    - name: Collect Switch artifacts
      run: |
        set -euo pipefail
        mkdir -p switch-artifacts
        cp build-switch/teeworlds.nro switch-artifacts/
        cp build-switch/teeworlds.nacp switch-artifacts/ 2>/dev/null || true
        cp teeworlds.json settings07.cfg switch-artifacts/
        if [[ -d build-switch/data ]]; then
          cp -a build-switch/data switch-artifacts/
        fi
    - name: Upload Switch artifacts
      uses: actions/upload-artifact@v4
      with:
        name: teeworlds-switch
        path: switch-artifacts
        if-no-files-found: error

  build-bam:
    runs-on: [self-hosted]
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]

    steps:
    - name: Checkout repository
      if: ${{ env.USE_LOCAL_WORKTREE != '1' }}
      uses: actions/checkout@v4
      with:
        token: ${{ env.CHECKOUT_TOKEN }}
        persist-credentials: true
    - name: Checkout submodules
      if: ${{ env.USE_LOCAL_WORKTREE != '1' }}
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE/*"
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
        auth_header="$(git -C "$GITHUB_WORKSPACE" config --local --get http.https://github.com/.extraheader || true)"
        git -C "$GITHUB_WORKSPACE" submodule sync --recursive
        if [[ -n "$auth_header" ]]; then
          git -C "$GITHUB_WORKSPACE" -c "http.extraheader=$auth_header" \
            -c protocol.version=2 submodule update --init --force --recursive \
            --depth=1
        else
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1
        fi

    - name: Checkout bam
      uses: actions/checkout@v4
      with:
        repository: matricks/bam
        ref: 07fbb5543c692f6b9a7f09e48c64e2368349a3a8
        path: ./bam

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install libfreetype6-dev libsdl2-dev -y
        cd bam
        ./make_unix.sh

    - name: Prepare MacOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install freetype sdl2
        cd bam
        ./make_unix.sh

    - name: Prepare Windows
      if: contains(matrix.os, 'windows')
      run: |
        cd bam
        ./make_win64_msvc.bat

    - name: Build in debug mode
      run: ./bam/bam conf=debug all
    - name: Test debug
      run: ./build/x86_64/debug/teeworlds_srv shutdown

    - name: Build in release mode
      run: ./bam/bam conf=release all
    - name: Test release
      run: ./build/x86_64/release/teeworlds_srv shutdown
